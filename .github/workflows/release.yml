name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lua_bin: lua5.4
            target_file: lua_sled.so
            asset_name: lua-sled-linux-lua5.4.so
          - os: macos-latest
            lua_bin: lua5.4
            target_file: lua_sled.so
            asset_name: lua-sled-macos-lua5.4.so
          - os: windows-latest
            lua_bin: lua5.4
            target_file: lua_sled.dll
            asset_name: lua-sled-windows-lua5.4.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install GNU host toolchain (Windows)
        if: runner.os == 'Windows'
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev pkg-config

      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          brew install lua@5.4 pkgconf
          LUA_PREFIX="$(brew --prefix lua@5.4)"
          echo "PKG_CONFIG_PATH=$LUA_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LUA_BIN=$LUA_PREFIX/bin/lua5.4" >> "$GITHUB_ENV"

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-lua54

      - name: Build
        if: runner.os != 'Windows'
        run: make LUA_BIN="$LUA_BIN" build

      - name: Build
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          mingw32-make build

      - name: Test
        if: runner.os != 'Windows'
        run: make LUA_BIN="$LUA_BIN" test

      - name: Test
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.cargo/bin:$PATH"
          mingw32-make test

      - name: Package artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp ${{ matrix.target_file }} dist/${{ matrix.asset_name }}

      - name: Package artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ${{ matrix.target_file }} dist/${{ matrix.asset_name }}

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
